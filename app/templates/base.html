<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}PDI · Trámites migratorios{% endblock %}</title>
<style>
:root{--azul:#0b3d6e;--fondo:#f4f6f9;--borde:#d5dbe3;--texto:#1d2733;--suave:#5b6878}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--texto)}
header{background:var(--azul);color:#fff;padding:14px 20px}header a{color:#fff;text-decoration:none;font-weight:600}
header small{opacity:.8;margin-left:8px}nav{float:right}nav a{margin-left:16px;font-weight:400}
main{max-width:920px;margin:24px auto;padding:0 16px}.caja{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}input,textarea,select{width:100%;padding:9px;border:1px solid var(--borde);border-radius:6px;font:inherit}
button{background:var(--azul);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;cursor:pointer;margin-top:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--borde);font-size:14px}
.p{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}
.Alta{background:#fdecea;color:#b3261e}.Media{background:#fef3e2;color:#9a5b00}.Baja{background:#e9f5ec;color:#1e6b34}
.estado{display:flex;gap:8px;flex-wrap:wrap}.estado span{padding:6px 12px;border-radius:16px;background:#e8ecf1;color:var(--suave);font-size:14px}
.estado span.on{background:var(--azul);color:#fff}.suave{color:var(--suave);font-size:14px}code{background:#eef1f5;padding:2px 6px;border-radius:4px;word-break:break-all}
pre{white-space:pre-wrap;background:#f7f8fa;padding:10px;border-radius:6px;font-size:13px}
</style></head><body>
<header><a href="/">PDI · Migraciones</a><small>Prueba de concepto · Lab 3 TICS413</small>
<nav><a href="/">Nuevo trámite</a><a href="/seguimiento">Seguimiento</a><a href="/bandeja">Bandeja</a></nav></header>
<main>{% block cuerpo %}{% endblock %}</main></body></html>
